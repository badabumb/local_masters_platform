services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: masters_db
      POSTGRES_USER: masters_user
      POSTGRES_PASSWORD: masters_password
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7

  app:
    build: .
    command: sh -c "python manage.py collectstatic --noinput && exec gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 30"
    environment:
      SECRET_KEY: testkey
      DEBUG: "True"
      ALLOWED_HOSTS: "*"
      DB_ENGINE: postgres
      POSTGRES_DB: masters_db
      POSTGRES_USER: masters_user
      POSTGRES_PASSWORD: masters_password
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      APP_VERSION: "1.0.1"
      APP_ENV: "production"
    ports:
      - "8080:8000"
    depends_on:
      - db
      - redis

volumes:
  postgres_data: