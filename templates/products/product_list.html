<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Работы мастеров</title>
</head>
<body>
    <h1>Работы мастеров</h1>

    {% if products %}
        <ul>
            {% for product in products %}
                <li>
                    {{ product.title }} — {{ product.price }} руб.<br>
                    {{ product.description }}
                </li>
            {% endfor %}
        </ul>
    {% else %}
        <p>Пока товаров нет.</p>
    {% endif %}

    <a href="/">На главную</a>
</body>
</html>
