{% extends "base.html" %}

{% block title %}Удалить товар{% endblock %}

{% block content %}
<section class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="form-card shadow-sm">
                <h1 class="h3 mb-4">Удалить товар</h1>
                <p class="text-muted">Вы уверены, что хотите удалить товар «{{ product.title }}»? Это действие нельзя отменить.</p>
                <form method="post">
                    {% csrf_token %}
                    <button class="btn btn-danger" type="submit">Удалить</button>
                    <a class="btn btn-outline-secondary" href="{% url 'product_detail' product.pk %}">Отмена</a>
                </form>
            </div>
        </div>
    </div>
</section>
{% endblock %}
